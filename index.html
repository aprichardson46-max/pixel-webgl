<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Pixel Golf</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>html,body{height:100%;margin:0;padding:0;background:#231F20}#unity-canvas{display:block}</style>
  </head>
  <body>
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1" style="width:100%;height:100%;position:fixed;"></canvas>

    <!-- Override Module.instantiateWasm to fetch & instantiate the wasm as an ArrayBuffer. -->
    <script>
      var Module = Module || {};
      Module.locateFile = function(path) {
        return 'Build/' + path;
      };

      Module.instantiateWasm = function(imports, receiveInstance) {
        return fetch('Build/Buildv_52.wasm', { credentials: 'same-origin' })
          .then(function(response) {
            if (!response.ok) throw new Error('Failed to load WASM: ' + response.status + ' ' + response.statusText);
            return response.arrayBuffer();
          })
          .then(function(bytes) {
            return WebAssembly.instantiate(bytes, imports);
          })
          .then(function(results) {
            receiveInstance(results.instance);
            return results.instance;
          })
          .catch(function(err) {
            console.error('WASM instantiate failed:', err);
            throw err;
          });
      };
    </script>

    <script src="Build/Buildv_52.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/Buildv_52.data",
        frameworkUrl: "Build/Buildv_52.framework.js",
        codeUrl: "Build/Buildv_52.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Firestorm Inc",
        productName: "Pixel Golf",
        productVersion: "1.0"
      }).then(function(unityInstance) {
        // success
      }).catch(function(message) {
        alert(message);
        console.error('createUnityInstance error:', message);
      });
    </script>
  </body>
</html>
