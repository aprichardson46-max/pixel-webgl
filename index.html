<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Pixel Golf</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Pixel Golf</div>
      </div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Buildv_65-2021 Edit.loader.js";
      var config = {
        dataUrl: buildUrl + "/Buildv_65-2021 Edit.data",
        frameworkUrl: buildUrl + "/Buildv_65-2021 Edit.framework.js",
        codeUrl: buildUrl + "/Buildv_65-2021 Edit.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Firestorm Inc",
        productName: "Pixel Golf",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        config.devicePixelRatio = 0.75; // Reduce pixel density for mobile

        // Reduce memory allocation for mobile
        config.matchWebGLToCanvasSize = false;

        unityShowBanner('WebGL builds are not supported on mobile devices.');
      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:

        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      loadingBar.style.display = "block";

      // WebGL comprehensive polyfill for mobile browsers
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Override WebGL context creation to add comprehensive mobile compatibility fixes
        const originalGetContext = HTMLCanvasElement.prototype.getContext;
        HTMLCanvasElement.prototype.getContext = function(contextType, options) {
          // Force conservative WebGL context options for mobile
          if (contextType === 'webgl' || contextType === 'experimental-webgl') {
            options = options || {};
            options.alpha = false;
            options.antialias = false;
            options.depth = true;
            options.stencil = false;
            options.premultipliedAlpha = false;
            options.preserveDrawingBuffer = false;
            options.powerPreference = "low-power";
            options.failIfMajorPerformanceCaveat = false;
          }
          
          const context = originalGetContext.call(this, contextType, options);
          
          if (context && (contextType === 'webgl' || contextType === 'experimental-webgl')) {
            console.log('Applying WebGL polyfills for mobile compatibility');
            
            // Fix shader precision format issues
            const originalGetShaderPrecisionFormat = context.getShaderPrecisionFormat;
            context.getShaderPrecisionFormat = function(shaderType, precisionType) {
              try {
                const result = originalGetShaderPrecisionFormat.call(this, shaderType, precisionType);
                
                // If the result is null or invalid, provide safe fallback values
                if (!result || result.rangeMin === undefined || result.rangeMax === undefined || result.precision === undefined) {
                  console.warn('getShaderPrecisionFormat returned null, using fallback values for shaderType:', shaderType, 'precisionType:', precisionType);
                  return {
                    rangeMin: 127,
                    rangeMax: 127,
                    precision: 23
                  };
                }
                
                return result;
              } catch (e) {
                console.warn('getShaderPrecisionFormat error, using fallback:', e);
                return {
                  rangeMin: 127,
                  rangeMax: 127,
                  precision: 23
                };
              }
            };

            // Fix shader creation issues
            const originalCreateShader = context.createShader;
            context.createShader = function(type) {
              try {
                const shader = originalCreateShader.call(this, type);
                if (!shader) {
                  console.warn('createShader returned null, retrying...');
                  // Retry shader creation
                  return originalCreateShader.call(this, type);
                }
                return shader;
              } catch (e) {
                console.error('Shader creation failed:', e);
                return null;
              }
            };

            // Limit texture units to mobile-safe values
            const originalGetParameter = context.getParameter;
            context.getParameter = function(pname) {
              try {
                const result = originalGetParameter.call(this, pname);
                
                // Limit texture units to prevent "Invalid texture unit" errors
                if (pname === context.MAX_TEXTURE_IMAGE_UNITS) {
                  return Math.min(result || 8, 8); // Limit to 8 texture units
                }
                if (pname === context.MAX_COMBINED_TEXTURE_IMAGE_UNITS) {
                  return Math.min(result || 8, 8); // Limit combined texture units
                }
                if (pname === context.MAX_VERTEX_TEXTURE_IMAGE_UNITS) {
                  return Math.min(result || 4, 4); // Limit vertex texture units
                }
                
                return result;
              } catch (e) {
                console.warn('getParameter error for', pname, ':', e);
                return null;
              }
            };

            // Add context lost handling
            this.addEventListener('webglcontextlost', function(event) {
              console.warn('WebGL context lost, preventing default...');
              event.preventDefault();
            });

            this.addEventListener('webglcontextrestored', function(event) {
              console.log('WebGL context restored');
            });

            // Fix extension handling
            const originalGetExtension = context.getExtension;
            context.getExtension = function(name) {
              try {
                return originalGetExtension.call(this, name);
              } catch (e) {
                console.warn('Extension', name, 'not available:', e);
                return null;
              }
            };

            // Fix getSupportedExtensions
            const originalGetSupportedExtensions = context.getSupportedExtensions;
            context.getSupportedExtensions = function() {
              try {
                return originalGetSupportedExtensions.call(this) || [];
              } catch (e) {
                console.warn('getSupportedExtensions failed:', e);
                return [];
              }
            };
          }
          
          return context;
        };
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
